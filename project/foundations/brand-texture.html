<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px 24px}
  .row{display:flex;gap:16px;align-items:stretch;height:150px}
  .mesh{flex:1.6;border-radius:var(--radius-lg);background-image:url(../assets/mesh-warm.png);background-size:cover;background-position:center;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
  .mesh span{position:absolute;left:16px;bottom:12px;font-size:12px;font-weight:600;color:var(--clay-800)}
  .item{width:120px;border-radius:var(--radius-lg);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:11px;color:var(--text-subtle);background-size:contain;background-repeat:no-repeat;background-position:center;border:1px solid var(--border-subtle)}
</style></head><body>
<div class="row">
  <div class="mesh"><span>mesh-warm.png</span></div>
  <div class="item" style="background-image:url(../assets/blob-blush.png)">blush</div>
  <div class="item" style="background-image:url(../assets/blob-clay.png)">clay</div>
  <div class="item" style="background-image:url(../assets/grain.png);background-size:cover;background-color:var(--sand-50)">grain</div>
</div>
</body></html>
