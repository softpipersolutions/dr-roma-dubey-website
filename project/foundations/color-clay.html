<!-- @dsCard group="Colors" viewport="760x180" name="Clay / Terracotta (primary)" subtitle="Brand ramp — 500 base, 600 interactive (AA), 700 hover/links" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:22px 26px}
  .ramp{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:7px}
  .chip{height:66px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}
  .name{font-size:11px;font-weight:var(--fw-semibold);color:var(--text-body)}
  .hex{font-size:10px;color:var(--text-subtle);font-family:var(--font-mono)}
</style></head><body>
<div class="ramp">
  <div class="sw"><div class="chip" style="background:var(--clay-50)"></div><span class="name">50</span><span class="hex">#FBF0EB</span></div>
  <div class="sw"><div class="chip" style="background:var(--clay-100)"></div><span class="name">100</span><span class="hex">#F6DED3</span></div>
  <div class="sw"><div class="chip" style="background:var(--clay-200)"></div><span class="name">200</span><span class="hex">#EFC3B0</span></div>
  <div class="sw"><div class="chip" style="background:var(--clay-300)"></div><span class="name">300</span><span class="hex">#E5A288</span></div>
  <div class="sw"><div class="chip" style="background:var(--clay-400)"></div><span class="name">400</span><span class="hex">#D68467</span></div>
  <div class="sw"><div class="chip" style="background:var(--clay-500);outline:2px solid var(--clay-800);outline-offset:2px"></div><span class="name">500 · base</span><span class="hex">#C97B63</span></div>
  <div class="sw"><div class="chip" style="background:var(--clay-600)"></div><span class="name">600 · action</span><span class="hex">#B65D42</span></div>
  <div class="sw"><div class="chip" style="background:var(--clay-700)"></div><span class="name">700 · hover</span><span class="hex">#9A4A34</span></div>
  <div class="sw"><div class="chip" style="background:var(--clay-800)"></div><span class="name">800</span><span class="hex">#7B3B29</span></div>
  <div class="sw"><div class="chip" style="background:var(--clay-900)"></div><span class="name">900</span><span class="hex">#5C2C1F</span></div>
</div>
</body></html>
