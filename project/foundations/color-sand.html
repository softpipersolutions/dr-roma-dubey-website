<!-- @dsCard group="Colors" viewport="760x180" name="Sand (warm neutrals)" subtitle="Never cold gray — every neutral carries warmth. 800 = espresso ink text" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:22px 26px}
  .ramp{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:7px}
  .chip{height:66px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs);border:1px solid rgba(61,43,38,.06)}
  .name{font-size:11px;font-weight:var(--fw-semibold);color:var(--text-body)}
  .hex{font-size:10px;color:var(--text-subtle);font-family:var(--font-mono)}
</style></head><body>
<div class="ramp">
  <div class="sw"><div class="chip" style="background:var(--sand-50)"></div><span class="name">50 · page</span><span class="hex">#FBF7F4</span></div>
  <div class="sw"><div class="chip" style="background:var(--sand-100)"></div><span class="name">100</span><span class="hex">#F5EDE7</span></div>
  <div class="sw"><div class="chip" style="background:var(--sand-200)"></div><span class="name">200 · border</span><span class="hex">#EADED5</span></div>
  <div class="sw"><div class="chip" style="background:var(--sand-300)"></div><span class="name">300</span><span class="hex">#DBC9BC</span></div>
  <div class="sw"><div class="chip" style="background:var(--sand-400)"></div><span class="name">400</span><span class="hex">#BCA595</span></div>
  <div class="sw"><div class="chip" style="background:var(--sand-500)"></div><span class="name">500</span><span class="hex">#96806F</span></div>
  <div class="sw"><div class="chip" style="background:var(--sand-600)"></div><span class="name">600 · muted</span><span class="hex">#6E5A4C</span></div>
  <div class="sw"><div class="chip" style="background:var(--sand-700)"></div><span class="name">700</span><span class="hex">#4E3E33</span></div>
  <div class="sw"><div class="chip" style="background:var(--sand-800)"></div><span class="name">800 · ink</span><span class="hex">#3D2B26</span></div>
  <div class="sw"><div class="chip" style="background:var(--sand-900)"></div><span class="name">900</span><span class="hex">#2A1D19</span></div>
</div>
</body></html>
