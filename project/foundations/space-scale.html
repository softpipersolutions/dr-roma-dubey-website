<!-- @dsCard group="Spacing" viewport="620x220" name="Space scale" subtitle="4px base grid — the rhythm of every layout" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px 26px}
  .row{display:flex;align-items:center;gap:12px;padding:3px 0}
  .bar{height:14px;background:var(--clay-400);border-radius:3px}
  .n{font-size:11px;color:var(--text-body);width:64px;font-family:var(--font-mono)}
  .px{font-size:11px;color:var(--text-subtle);font-family:var(--font-mono)}
</style></head><body>
  <div class="row"><span class="n">space-1</span><div class="bar" style="width:4px"></div><span class="px">4</span></div>
  <div class="row"><span class="n">space-2</span><div class="bar" style="width:8px"></div><span class="px">8</span></div>
  <div class="row"><span class="n">space-3</span><div class="bar" style="width:12px"></div><span class="px">12</span></div>
  <div class="row"><span class="n">space-4</span><div class="bar" style="width:16px"></div><span class="px">16</span></div>
  <div class="row"><span class="n">space-6</span><div class="bar" style="width:24px"></div><span class="px">24</span></div>
  <div class="row"><span class="n">space-8</span><div class="bar" style="width:32px"></div><span class="px">32</span></div>
  <div class="row"><span class="n">space-12</span><div class="bar" style="width:48px"></div><span class="px">48</span></div>
  <div class="row"><span class="n">space-16</span><div class="bar" style="width:64px"></div><span class="px">64</span></div>
  <div class="row"><span class="n">space-24</span><div class="bar" style="width:96px"></div><span class="px">96</span></div>
</body></html>
