<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Generous & rounded — nothing is sharp-cornered. Cards use lg (20px)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:22px 26px}
  .row{display:flex;gap:16px;align-items:flex-end}
  .item{display:flex;flex-direction:column;gap:8px;align-items:center}
  .box{width:74px;height:64px;background:var(--blush-200);border:1.5px solid var(--clay-300)}
  .lbl{font-size:11px;color:var(--text-body);font-family:var(--font-mono)}
</style></head><body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="lbl">xs · 6</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="lbl">sm · 10</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="lbl">md · 14</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="lbl">lg · 20</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="lbl">xl · 28</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="lbl">2xl · 36</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill);width:100px"></div><span class="lbl">pill</span></div>
  </div>
</body></html>
