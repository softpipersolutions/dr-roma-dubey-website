<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:22px 26px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .col{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:16px 18px}
  .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
  .do .tag{color:var(--success-text)}
  .no .tag{color:var(--danger-text)}
  p{margin:0 0 8px;font-size:14px;line-height:1.5;color:var(--text-body)}
  p:last-child{margin:0}
  .q{color:var(--text-strong);font-weight:500}
</style></head><body>
<div class="grid">
  <div class="col do">
    <p class="tag">Do</p>
    <p class="q">"Caring for every woman, at every stage of life."</p>
    <p class="q">"Planning for a family? Explore fertility."</p>
    <p style="color:var(--text-subtle);font-size:12px">Warm, specific, benefit-led. Sentence case.</p>
  </div>
  <div class="col no">
    <p class="tag">Don't</p>
    <p class="q">"BOOK NOW!!! 🔥 Best gynae in town 💯"</p>
    <p class="q">"Utilize our comprehensive solutions."</p>
    <p style="color:var(--text-subtle);font-size:12px">No hype, all-caps, emoji spam, or cold jargon.</p>
  </div>
</div>
</body></html>
