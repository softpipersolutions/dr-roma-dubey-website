<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px 26px;color:var(--text-body)}
  .line{display:flex;align-items:baseline;gap:14px;padding:5px 0}
  .tag{font-size:10px;color:var(--text-subtle);font-family:var(--font-mono);white-space:nowrap;margin-left:auto}
</style></head><body>
  <div class="line"><span style="font-size:20px;font-weight:600;color:var(--text-strong)">Lead — women's wellness</span><span class="tag">lg · 20</span></div>
  <div class="line"><span style="font-size:18px">Body large, for intros and calm reassurance.</span><span class="tag">md · 18</span></div>
  <div class="line"><span style="font-size:16px">Base body — the default reading size across the site.</span><span class="tag">base · 16</span></div>
  <div class="line"><span style="font-size:14px;color:var(--text-muted)">Small — captions, helper text and metadata.</span><span class="tag">sm · 14</span></div>
  <div class="line"><span style="font-size:12px;color:var(--text-subtle)">Extra small — legal, timestamps.</span><span class="tag">xs · 12</span></div>
</body></html>
