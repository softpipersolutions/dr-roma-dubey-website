<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:0}
  .wrap{display:grid;grid-template-columns:1.3fr 1fr;height:240px}
  .a{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 34px}
  .name{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--sand-800);line-height:1}
  .name em{font-style:normal;color:var(--clay-600)}
  .sub{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle)}
  .b{display:flex;align-items:center;justify-content:center;gap:22px;background:var(--cream)}
  .mono{width:78px;height:78px;border-radius:50%;background:var(--clay-600);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;letter-spacing:-.02em;box-shadow:var(--shadow-brand)}
  .mono2{width:78px;height:78px;border-radius:50%;background:var(--surface-card);color:var(--clay-700);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;border:1.5px solid var(--clay-300)}
</style></head><body>
<div class="wrap">
  <div class="a">
    <div class="name">Dr. Roma <em>Dubey</em></div>
    <div class="sub">Gynaecology · Women's Health</div>
  </div>
  <div class="b">
    <div class="mono">RD</div>
    <div class="mono2">RD</div>
  </div>
</div>
</body></html>
