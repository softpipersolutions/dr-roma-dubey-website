<!-- @dsCard group="Spacing" viewport="760x200" name="Shadows" subtitle="Soft & espresso-tinted (never black). Warm brand glow for CTAs" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:26px}
  .row{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .item{display:flex;flex-direction:column;gap:12px;align-items:center}
  .box{width:92px;height:64px;background:var(--surface-card);border-radius:var(--radius-md)}
  .lbl{font-size:11px;color:var(--text-body);font-family:var(--font-mono)}
</style></head><body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="lbl">xs</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="lbl">sm</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="lbl">md</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="lbl">lg</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="lbl">xl</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-brand);background:var(--clay-500)"></div><span class="lbl">brand</span></div>
  </div>
</body></html>
