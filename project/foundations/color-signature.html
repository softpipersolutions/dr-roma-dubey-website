<!-- @dsCard group="Colors" viewport="620x180" name="Blush & Signature" subtitle="Soft accent + the signature cream, brand base and espresso ink" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:22px 26px}
  .ramp{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:7px}
  .chip{height:66px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs);border:1px solid rgba(61,43,38,.06)}
  .name{font-size:11px;font-weight:var(--fw-semibold);color:var(--text-body)}
  .hex{font-size:10px;color:var(--text-subtle);font-family:var(--font-mono)}
  .div{width:1px;background:var(--border-subtle);margin:0 6px}
</style></head><body>
<div class="ramp">
  <div class="sw"><div class="chip" style="background:var(--blush-100)"></div><span class="name">blush-100</span><span class="hex">#FBE9E2</span></div>
  <div class="sw"><div class="chip" style="background:var(--blush-300)"></div><span class="name">blush-300</span><span class="hex">#F0C2AE</span></div>
  <div class="sw"><div class="chip" style="background:var(--blush-500)"></div><span class="name">blush-500</span><span class="hex">#E8B4A0</span></div>
  <div class="div"></div>
  <div class="sw"><div class="chip" style="background:var(--cream)"></div><span class="name">cream</span><span class="hex">#F5E6DE</span></div>
  <div class="sw"><div class="chip" style="background:var(--clay-500)"></div><span class="name">brand</span><span class="hex">#C97B63</span></div>
  <div class="sw"><div class="chip" style="background:var(--sand-800)"></div><span class="name">ink</span><span class="hex">#3D2B26</span></div>
</div>
</body></html>
