<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); color: var(--text-body); font-family: var(--font-sans); }
  #root { padding: 28px 30px; }
  .grp { margin-bottom: 26px; }
  .lbl { font-size: var(--text-xs); font-weight: var(--fw-bold); letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-subtle); margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  a { color: var(--text-link); } a:hover { color: var(--text-link-hover); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const DS = window.DrRomaDubeyDesignSystem_317be8;
const { Card, Badge, Tag, Avatar, ServiceCard, Testimonial, Accordion, Tabs, Dialog, Button } = DS;

function Group({ label, children }) { return (<div className="grp"><p className="lbl">{label}</p>{children}</div>); }

function Demo() {
  const [open, setOpen] = React.useState(false);
  return (
    <div>
      <Group label="Cards">
        <div className="grid3">
          <Card variant="elevated"><strong style={{color:'var(--text-strong)'}}>Elevated</strong><p style={{margin:'6px 0 0',color:'var(--text-muted)',fontSize:'var(--text-sm)'}}>Soft espresso shadow.</p></Card>
          <Card variant="outline"><strong style={{color:'var(--text-strong)'}}>Outline</strong><p style={{margin:'6px 0 0',color:'var(--text-muted)',fontSize:'var(--text-sm)'}}>Hairline border.</p></Card>
          <Card variant="soft"><strong style={{color:'var(--text-strong)'}}>Soft</strong><p style={{margin:'6px 0 0',color:'var(--text-muted)',fontSize:'var(--text-sm)'}}>Clay-tinted panel.</p></Card>
        </div>
      </Group>
      <Group label="Badges & tags">
        <div className="row" style={{marginBottom:12}}>
          <Badge tone="brand" icon="calendar">Upcoming</Badge>
          <Badge tone="success" dot>Confirmed</Badge>
          <Badge tone="warning" dot>Pending</Badge>
          <Badge tone="danger" dot>Overdue</Badge>
          <Badge tone="info" icon="info">Info</Badge>
          <Badge tone="brand" solid>Solid</Badge>
        </div>
        <div className="row">
          <Tag icon="droplet">PCOS</Tag>
          <Tag selected>Fertility</Tag>
          <Tag icon="baby">Pregnancy care</Tag>
          <Tag onRemove={()=>{}}>Menopause</Tag>
        </div>
      </Group>
      <Group label="Avatars">
        <div className="row">
          <Avatar name="Roma Dubey" size="xl" ring />
          <Avatar name="Priya Sharma" size="lg" />
          <Avatar name="Aarti Verma" size="md" status="online" />
          <Avatar name="S K" size="sm" status="away" />
        </div>
      </Group>
      <Group label="Service cards">
        <div className="grid3">
          <ServiceCard icon="droplet" title="Pap Smear" description="Designed to detect cervical cancer." href="#" />
          <ServiceCard icon="baby" title="Fertility Test" description="Planning for a family?" tone="blush" linkLabel="Explore fertility" href="#" />
          <ServiceCard icon="shield-check" title="Vaccination" description="Cervical cancer vaccination." tone="sage" href="#" />
        </div>
      </Group>
      <div className="two">
        <Group label="Testimonial">
          <Testimonial rating={5} quote="Dr. Roma guided me through my entire pregnancy with so much care and expertise." author="Priya Sharma" role="New mother" />
        </Group>
        <Group label="Tabs & accordion">
          <Tabs variant="pill" defaultValue="a" items={[
            {value:'a',label:'Week'},{value:'b',label:'Month'},{value:'c',label:'Year'}
          ]} />
          <div style={{height:14}} />
          <Accordion defaultOpen={[0]} items={[
            {title:'How can I book an appointment?', content:'Book through call or WhatsApp for either clinic.'},
            {title:'What should I bring?', content:'Any previous records, reports, and current medications.'},
          ]} />
        </Group>
      </div>
      <Group label="Dialog">
        <Button variant="outline" onClick={()=>setOpen(true)}>Open dialog</Button>
        <Dialog open={open} onClose={()=>setOpen(false)} title="Confirm your appointment"
          description="We'll send a confirmation on WhatsApp once payment is received."
          footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cancel</Button><Button variant="whatsapp" leftIcon="message">Confirm on WhatsApp</Button></>}>
          <Card variant="cream" padding="sm"><span style={{fontSize:'var(--text-sm)',color:'var(--text-muted)'}}>Tue, 16 Jul · 11:30 AM · Maitri Mahila Clinic</span></Card>
        </Dialog>
      </Group>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
