<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); color: var(--text-body); font-family: var(--font-sans); }
  #root { padding: 28px 30px; }
  .grp { margin-bottom: 26px; }
  .lbl { font-size: var(--text-xs); font-weight: var(--fw-bold); letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-subtle); margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 14px; max-width: 320px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  a { color: var(--text-link); } a:hover { color: var(--text-link-hover); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, IconButton, Input, Textarea, Select, Checkbox, Radio, RadioGroup, Switch } = window.DrRomaDubeyDesignSystem_317be8;

function Group({ label, children }) {
  return (<div className="grp"><p className="lbl">{label}</p>{children}</div>);
}

function Demo() {
  return (
    <div>
      <Group label="Buttons — variants">
        <div className="row">
          <Button variant="primary" rightIcon="arrow-right">Visit Now</Button>
          <Button variant="secondary">Learn More</Button>
          <Button variant="outline">Read guide</Button>
          <Button variant="ghost">Skip</Button>
          <Button variant="whatsapp" leftIcon="message">Connect on WhatsApp</Button>
        </div>
      </Group>
      <Group label="Buttons — sizes & states">
        <div className="row">
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg">Large</Button>
          <Button leftIcon="calendar">Book visit</Button>
          <Button loading>Saving</Button>
          <Button disabled>Disabled</Button>
        </div>
      </Group>
      <Group label="Icon buttons">
        <div className="row">
          <IconButton icon="heart" label="Save" variant="solid" />
          <IconButton icon="bell" label="Alerts" variant="soft" />
          <IconButton icon="search" label="Search" variant="outline" />
          <IconButton icon="settings" label="Settings" variant="ghost" />
          <IconButton icon="x" label="Close" variant="soft" round />
          <IconButton icon="phone" label="Call" variant="solid" size="lg" round />
        </div>
      </Group>
      <div className="two">
        <Group label="Text fields">
          <div className="col">
            <Input label="Full name" placeholder="Your name" />
            <Input label="Phone" leftIcon="phone" placeholder="+91 98765 43210" />
            <Input label="Email" error="Enter a valid email" defaultValue="roma@" />
          </div>
        </Group>
        <Group label="Select & textarea">
          <div className="col">
            <Select label="Clinic" placeholder="Choose location" options={["Maitri Mahila Clinic","Aryavart Hospital"]} />
            <Textarea label="Your message" rows={3} placeholder="How can we help?" />
          </div>
        </Group>
      </div>
      <div className="two">
        <Group label="Checkbox & switch">
          <div className="col">
            <Checkbox label="Consent to teleconsultation" defaultChecked />
            <Checkbox label="Subscribe to health tips" />
            <Checkbox label="Disabled option" disabled />
            <Switch label="WhatsApp reminders" defaultChecked />
            <Switch label="Email updates" />
          </div>
        </Group>
        <Group label="Radio group">
          <RadioGroup name="delivery" defaultValue="normal" options={[
            {value:'normal',label:'Normal delivery'},
            {value:'csection',label:'C-section'},
            {value:'unsure',label:'Not sure yet'},
          ]} />
        </Group>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
